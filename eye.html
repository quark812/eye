<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глаз</title>
<style>
  :root { color-scheme: dark; --bg: #000; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 800 / 616; background: var(--bg); }
</style>
</head>
<body>
<canvas id="c" width="800" height="616"></canvas>
<script>
(function () {
  var COLS = 100, ROWS = 56, CW = 8, CH = 11, LOOP = 13;
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  ctx.font = "bold 9px Consolas, 'DejaVu Sans Mono', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = rng(7), CHARS = "01<>{}[]=+/\\|;:#";
  var chars = [];
  for (var i = 0; i < COLS * ROWS; i++) chars.push(CHARS[Math.floor(rnd() * CHARS.length)]);

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
  function mix(p, q, k) { return [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k, p[2] + (q[2] - p[2]) * k]; }

  var SKIN = [150, 80, 50], SCLERA = [240, 238, 235], IRIS_A = [120, 55, 10], IRIS_B = [235, 150, 25], PUPIL = [8, 6, 6], DARK = [4, 5, 12];

  function eyeColor(u, v, t, zoom) {
    var gx = 0.05 * Math.sin(t * 0.9), gy = 0.03 * Math.sin(t * 0.6);
    var open = smooth(0.2, 1.4, t) * (1 - 0.95 * Math.exp(-Math.pow(t - 4, 2) / 0.02));
    var x = u / (zoom * 1.5), y = v / (zoom * 1.5);
    var h = 0.42 * open * Math.pow(Math.max(0, 1 - Math.pow(x / 0.95, 2)), 0.8);
    if (Math.abs(y) > h || Math.abs(x) > 0.95) return mix([40, 20, 12], SKIN, 0.55 + 0.25 * (1 - clamp(Math.abs(y) * 1.5, 0, 1)));
    var dx = x - gx, dy = y - gy, r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    var irisR = 0.36, pupilR = 0.15 + 0.03 * Math.sin(t * 1.3);
    if (r > irisR) return mix(SCLERA, [190, 150, 140], Math.pow(clamp(Math.abs(x) / 0.95, 0, 1), 3));
    if (r < pupilR) return Math.hypot(dx + 0.05, dy + 0.05) < 0.025 ? [255, 255, 255] : PUPIL;
    var streak = 0.5 + 0.5 * Math.sin(ang * 18 + Math.sin(ang * 5) * 2);
    var k = clamp((r - pupilR) / (irisR - pupilR), 0, 1);
    return mix(IRIS_B, IRIS_A, Math.pow(k, 1.5) * 0.8 + streak * 0.25);
  }

  var aspect = (COLS * CW) / (ROWS * CH), start = performance.now();

  function frame(now) {
    var t = ((now - start) / 1000) % LOOP;
    var zoom = 1 + 6.5 * Math.pow(smooth(5, 10.5, t), 1.6) * 1.8;
    var sky = smooth(9, 10.8, t);
    var fade = 1 - smooth(11.4, 12.9, t);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
    for (var r = 0; r < ROWS; r++) {
      var v = (r / (ROWS - 1) - 0.5) * 2;
      for (var c = 0; c < COLS; c++) {
        var u = (c / (COLS - 1) - 0.5) * 2 * aspect;
        var col = mix(eyeColor(u, v, t, zoom), DARK, sky);
        var ch = chars[r * COLS + c], k = (r % 2 ? 0.82 : 1) * 1.4 * fade;
        if (sky > 0.6 && col[0] + col[1] + col[2] < 40) continue;
        ctx.fillStyle = "rgb(" + Math.min(255, col[0] * k | 0) + "," + Math.min(255, col[1] * k | 0) + "," + Math.min(255, col[2] * k | 0) + ")";
        ctx.fillText(ch, c * CW + CW / 2, r * CH + CH / 2);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
